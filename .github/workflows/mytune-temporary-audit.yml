name: Temporary MyTune audit cleanup
on:
  push:
    branches: [arena/2d88b224-guzzionboard]
    paths: [.github/workflows/mytune-temporary-audit.yml]
permissions: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
    steps:
      - name: Remove temporary audit output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Redact the one summary that inadvertently included short vendor
          # sample-log excerpts; retain only factual findings in the project docs.
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/check-runs/124490740668" \
            -f 'output[title]=Temporary MyTune audit (redacted)' \
            -f 'output[summary]=Temporary installer inventory removed after review; see the project audit documentation.' > /dev/null
          # Delete only the seven temporary workflow runs created for this audit.
          for id in 41184898518 41184943556 41184968672 41185045308 41185110299 41185213919 41185293126; do
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$id" > /dev/null
          done
