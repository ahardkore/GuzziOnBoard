# The project ships no C extensions and supports 3.11+; keep the parser honest
# about that rather than about whatever interpreter runs the linter.
target-version = "py311"
line-length = 100
# Vendored mirrors and the packaging build tree are not this project's source.
extend-exclude = ["vendor", "build", "dist", "web", "cloudflare"]

[lint]
# Deliberately a correctness gate, not a style revolution: every rule selected
# here passes on the tree as it stands, so a new violation is a new bug rather
# than a pre-existing wart. Widen it (line length, naming, docstrings) as the
# files are touched; do not add a rule and a blanket ignore in the same change.
select = [
    "E4", "E9",            # real syntax/import problems
    "F",                   # pyflakes: undefined names, unused imports
    "I",                   # import order, so diffs stay small
    "W6",                  # invalid escape sequences
    "B006", "B008", "B017",  # mutable defaults, blind excepts in tests
    "RUF100",              # an unused `noqa` hides the next real violation
]
# The test suite deliberately asserts broad exception classes in places where
# the point *is* that some exception escapes (a transport boundary), and uses
# small constant defaults for readability.
ignore = ["B017", "B008"]

[lint.per-file-ignores]
# Scripts put ``sys.path`` in place before importing the package, which is the
# only way they can run from a checkout without installation.
"scripts/*" = ["I001", "E402"]
# Capability probes are intentional ``import x`` statements in a try block.
"guzzionboard/workstation.py" = ["F401"]
"packaging/build.py" = ["F401"]
# These directories are large, dense test fixtures written before the style
# rules existed. They still get the correctness rules (F, I, E4/E9) above;
# the one-line-statement and lambda style rules are not retrofitted here.
"tests/**" = ["E701", "E702", "E731", "E741", "E402", "F401"]

[format]
quote-style = "double"
# The tree is formatted with mixed quotes today; only the lines a change
# touches are reformatted.
docstring-code-format = false
