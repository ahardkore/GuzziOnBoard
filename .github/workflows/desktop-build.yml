name: Desktop application

# Builds the installable desktop application and puts it where a user can
# download it. Pushing a tag like v0.4.0 attaches the artifacts to that
# release; a pull request builds them all the same way but only uploads them
# as workflow artifacts, so the build is proven before a release exists.
#
# A tag build that could not publish - a failed Release step, a permissions
# mistake - is repaired without moving the tag: dispatch this workflow from a
# branch that carries the fix, name the tag, and it checks that tag out, builds
# it, and attaches the artifacts to its release.
#
#   gh workflow run desktop-build.yml --ref <branch> -f release=true -f tag=v0.4.0
#
# The three release jobs escalate `contents: write` for exactly that reason:
# the workflow is `contents: read` everywhere else, and writing a release needs
# more than reading one.
#
# Every job runs `--selftest` against the artifact it just produced. A
# PyInstaller build that is missing a catalog file, an XDF, a web asset or the
# checksum worker still "succeeds" - the self-test is what refuses it.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'guzzionboard/**'
      - 'cloudflare/**'
      - 'scripts/build_cloudflare_catalog.py'
      - 'web/**'
      - 'packaging/**'
      - 'vendor/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the artifacts to the tag release (tag builds do this anyway)'
        type: boolean
        default: false
      tag:
        description: 'The existing tag to publish with `release` (e.g. v0.4.0); empty means the dispatched ref'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a publish dispatch names its tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - name: Run the test suite
        run: pytest -q

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write          # the Release step creates the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a publish dispatch names its tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: pip install pyinstaller pywebview
      - name: Download the WebView2 bootstrapper (optional, for old machines)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/resources | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile packaging/resources/MicrosoftEdgeWebView2Setup.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the application and the installer
        shell: bash
        run: |
          set -o pipefail
          python packaging/build.py --installer --portable-zip 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        shell: bash
        run: |
          {
            echo "::error title=Desktop build failed::$(tail -c 1800 build.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"
          }
      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: guzzionboard-windows-installer
          path: |
            dist/*setup*.exe
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/windows-*-selftest.log
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*setup*.exe
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/windows-*-selftest.log
          body: |
            GuzziOnBoard ${{ inputs.tag || github.ref_name }} — desktop application.

            Download the `setup.exe` to install it (per-user, no administrator
            prompt), or the portable zip to run it from any folder. macOS ships
            the `.app` inside its zip; Linux ships a folder build with
            `install.sh` and, for now, no window engine - there it serves the
            workstation and opens your browser.

            Everything here is unsigned, so SmartScreen and Gatekeeper will
            have something to say, and there is no `.dmg`, no `.deb` and no
            auto-update. Each platform's `SHA256SUMS-*.txt`, and the transcript
            of the self-test that artifact passed, sit next to it.

            CI checks the Windows setup the blunt way - silent install, launch
            the installed application, uninstall, and the user's own files left
            where they were - but no human has clicked through the installer
            wizard. Nothing has been validated on a real motorcycle: read the
            README before connecting anything to a bike, and `docs/DESKTOP.md`
            for what is and is not proven.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The installer is what a Windows user actually runs, and no human has
  # clicked through it yet. This job does the next best thing on a clean
  # runner: install it silently, launch the *installed* application's own
  # self-test, then uninstall it and check that the user's own files - session
  # logs, backups, base maps - were left where they were. It also launches
  # the installed app the way a double-click does and demands a window - or
  # an explained fallback - because the window is created on a GUI thread
  # whose failures are otherwise silent (that is how 0.4.0 shipped). The
  # steps live in packaging/installer/windows-install-check.ps1 so they can
  # be read, and run, without a workflow in the way.
  windows-install:
    name: Windows install and uninstall
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25                  # a hung installer must not look busy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a publish dispatch names its tag
      - uses: actions/download-artifact@v4
        with:
          name: guzzionboard-windows-installer
          path: dist

      - name: Check the install check parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'packaging/installer/windows-install-check.ps1', [ref]$null, [ref]$errors)
          if ($errors.Count) {
            Write-Host "::error title=The install check has a syntax error::$($errors[0].Message)"
            exit 1
          }
          Write-Host 'the install check parses'

      - name: Install, launch, uninstall
        shell: pwsh
        run: pwsh -File packaging/installer/windows-install-check.ps1 -Dist dist

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-report
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/installed-selftest.log
            ${{ runner.temp }}/windowed-desktop.log
          if-no-files-found: ignore

  desktop-ui:
    name: UI in the desktop shell (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a publish dispatch names its tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -e .
      - run: npm ci
      - name: Run the workstation behind the desktop shell
        # The other browser gate runs the page on a static host (the demo
        # path). This one runs it behind `guzzionboard-desktop --no-window`:
        # real API, injected bridge, exports written to a real folder.
        run: npm run test:browser:desktop

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the Release step creates the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a publish dispatch names its tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies and a webview engine
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-0 libwebkit2gtk-4.1-0 \
                                  libgl1 libxkbcommon0 libegl1
          pip install pyinstaller
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Browser gate (the UI on a static host, as the demo serves it)
        run: |
          npm ci
          npx playwright test --config playwright.config.mjs
      - name: Build
        run: |
          set -o pipefail
          python packaging/build.py --portable-zip 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        run: |
          echo "::error title=Linux build failed::$(tail -c 1800 build.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"

      - name: Install it like a user would
        run: |
          set -o pipefail
          sh packaging/installer/linux-install-check.sh dist/GuzziOnBoard 2>&1 | tee install.log
      - name: Explain a failed install
        if: failure()
        run: |
          echo "::error title=Linux install failed::$(tail -c 1500 install.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"

      - uses: actions/upload-artifact@v4
        with:
          name: guzzionboard-linux
          path: |
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/linux-x64-selftest.log
            dist/linux-install-selftest.log
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/linux-*-selftest.log
          body: |
            GuzziOnBoard ${{ inputs.tag || github.ref_name }} — desktop application.

            Download the `setup.exe` to install it (per-user, no administrator
            prompt), or the portable zip to run it from any folder. macOS ships
            the `.app` inside its zip; Linux ships a folder build with
            `install.sh` and, for now, no window engine - there it serves the
            workstation and opens your browser.

            Everything here is unsigned, so SmartScreen and Gatekeeper will
            have something to say, and there is no `.dmg`, no `.deb` and no
            auto-update. Each platform's `SHA256SUMS-*.txt`, and the transcript
            of the self-test that artifact passed, sit next to it.

            CI checks the Windows setup the blunt way - silent install, launch
            the installed application, uninstall, and the user's own files left
            where they were - but no human has clicked through the installer
            wizard. Nothing has been validated on a real motorcycle: read the
            README before connecting anything to a bike, and `docs/DESKTOP.md`
            for what is and is not proven.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS build
    runs-on: macos-latest
    permissions:
      contents: write          # the Release step creates the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a publish dispatch names its tag
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pyinstaller pywebview
      - name: Build the .app bundle and archive it
        run: |
          set -o pipefail
          python packaging/build.py --portable-zip 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        run: |
          echo "::error title=macOS build failed::$(tail -c 1800 build.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"

      - uses: actions/upload-artifact@v4
        with:
          name: guzzionboard-macos
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
            dist/macos-*-selftest.log
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
            dist/macos-*-selftest.log
          body: |
            GuzziOnBoard ${{ inputs.tag || github.ref_name }} — desktop application.

            Download the `setup.exe` to install it (per-user, no administrator
            prompt), or the portable zip to run it from any folder. macOS ships
            the `.app` inside its zip; Linux ships a folder build with
            `install.sh` and, for now, no window engine - there it serves the
            workstation and opens your browser.

            Everything here is unsigned, so SmartScreen and Gatekeeper will
            have something to say, and there is no `.dmg`, no `.deb` and no
            auto-update. Each platform's `SHA256SUMS-*.txt`, and the transcript
            of the self-test that artifact passed, sit next to it.

            CI checks the Windows setup the blunt way - silent install, launch
            the installed application, uninstall, and the user's own files left
            where they were - but no human has clicked through the installer
            wizard. Nothing has been validated on a real motorcycle: read the
            README before connecting anything to a bike, and `docs/DESKTOP.md`
            for what is and is not proven.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: CI — tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.11]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python build/test deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e '.[dev]'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm deps
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run built-in self-test
        run: python -m guzzionboard --selftest

      - name: Run pytest
        run: pytest -q

      - name: Run Playwright browser tests
        run: npx playwright test --reporter=list
