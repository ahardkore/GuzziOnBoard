# Production relay for Workers Builds. This is separate from the public website
# Worker named "guzzionboard". It contains only a D1 resource ID, never secrets.
# Preferred entry point: sh scripts/deploy_worker.sh  (deploys on the production
# branch, uploads a version elsewhere). Manual equivalent, from the repository
# root: npx wrangler deploy --config cloudflare/wrangler.build.toml
name = "guzzionboard-validation"
main = "worker.mjs"
compatibility_date = "2025-08-01"
workers_dev = true
preview_urls = false

# Preserve dashboard-configured public variables on subsequent deployments.
# Cloudflare preserves encrypted secrets separately.
keep_vars = true

# Match the Worker's dashboard setting. Workers Builds offers to "update your
# Wrangler configuration to keep deployments in sync"; when the dashboard has
# observability off, saying so here stops the deploy from re-applying it, and
# keeps the built configuration identical to what the dashboard shows.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "guzzionboard"
database_id = "66e69f17-cf5b-4728-b07b-6eb365be587f"
