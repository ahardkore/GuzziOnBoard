name: Temporary user content fetch

on:
  workflow_dispatch:
    inputs:
      url:
        description: Direct download URL to fetch
        required: true
        type: string
      dest:
        description: Destination directory inside the repo
        required: true
        type: string
        default: usercontent/incoming

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.dest }}
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          name="$(basename "${URL%%\?*}")"
          curl -fsSL --retry 3 -o "$DEST/$name" "$URL"
          ls -l "$DEST/$name"
          if file "$DEST/$name" | grep -qi zip; then
            unzip -o -q "$DEST/$name" -d "$DEST"
          fi
          find "$DEST" -type f -printf '%s\t%p\n'

      - name: Commit
        env:
          DEST: ${{ inputs.dest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Temporary: fetched user content into $DEST [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
