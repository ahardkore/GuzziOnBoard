name: Temporary user content fetch

on:
  push:
    paths:
      - ".fetch-trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download
        run: |
          set -euo pipefail
          dest="usercontent/incoming"
          mkdir -p "$dest"
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            name="$(basename "${url%%\?*}")"
            name="${name//%20/_}"
            curl -fsSL --retry 3 -o "$dest/$name" "$url"
            if file "$dest/$name" | grep -qi zip; then
              out="$dest/${name%.*}"
              mkdir -p "$out"
              unzip -o -q "$dest/$name" -d "$out"
            fi
          done < .fetch-trigger
          find "$dest" -type f -printf '%s\t%p\n'

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f usercontent .fetch-trigger
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Temporary: fetched user content [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
