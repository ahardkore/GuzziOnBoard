name: Desktop application

# Builds the installable desktop application and puts it where a user can
# download it. Pushing a tag like v0.4.0 attaches the artifacts to that
# release; a pull request builds them all the same way but only uploads them
# as workflow artifacts, so the build is proven before a release exists.
#
# Every job runs `--selftest` against the artifact it just produced. A
# PyInstaller build that is missing a catalog file, an XDF, a web asset or the
# checksum worker still "succeeds" - the self-test is what refuses it.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'guzzionboard/**'
      - 'web/**'
      - 'packaging/**'
      - 'vendor/**'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Attach the artifacts to the tag release (tag builds do this anyway)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Run the test suite
        run: pytest -q

  windows:
    name: Windows installer
    runs-on: windows-latest
    # Publishing needs contents: write. The workflow defaults to read, and a
    # read-only token makes softprops/action-gh-release fail with "Resource
    # not accessible by integration" - the build succeeds, the release does
    # not, and the artifacts end up nowhere a user can download them. Only the
    # three jobs that actually publish are granted it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: pip install pyinstaller pywebview
      - name: Download the WebView2 bootstrapper (optional, for old machines)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/resources | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile packaging/resources/MicrosoftEdgeWebView2Setup.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the application and the installer
        shell: bash
        run: |
          set -o pipefail
          python packaging/build.py --installer --portable-zip 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        shell: bash
        run: |
          {
            echo "::error title=Desktop build failed::$(tail -c 1800 build.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"
          }
      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: guzzionboard-windows-installer
          path: |
            dist/*setup*.exe
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        # Only this job writes the notes. The other two publish without a
        # body, and softprops keeps an existing body when none is supplied,
        # so the text below survives whichever job happens to create the
        # release first.
        with:
          files: |
            dist/*setup*.exe
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/*selftest*.log
          body: |
            GuzziOnBoard ${{ github.ref_name }} — the workstation as an application you install and launch.

            ## Install

            * **Windows** — `GuzziOnBoard-<version>-setup.exe`: per-user, no administrator prompt, Start-menu entry, uninstaller. The portable `.zip` runs from any folder without installing.
            * **macOS (arm64)** — `GuzziOnBoard-<version>-macos-arm64.zip`: unzip, drag `GuzziOnBoard.app` to Applications.
            * **Linux (x64)** — `GuzziOnBoard-<version>-linux-x64-portable.zip`: unzip and run `install.sh` (a per-user script, no root), or run the folder as it is.

            Check what you downloaded: each platform's `SHA256SUMS-*.txt` and the `--selftest` transcripts CI produced are attached next to the binaries.

            ## Honest limits

            * **Unsigned.** Windows SmartScreen will say *Windows protected your PC* (*More info* → *Run anyway*); macOS Gatekeeper wants a right-click → *Open* the first time. Signing needs certificates this project does not have.
            * **Not a package.** No `.dmg`, no `.deb`, no Flatpak, and **no auto-update**. New versions are downloaded from this page and installed over the old one.
            * **No human has clicked through the installer wizard.** CI installs it silently on a clean runner, runs the installed application's own `--selftest`, then uninstalls it and checks your files were left alone. A robot pressing *Next* is not a person reading the pages, and nothing has verified the wizard's appearance, the licence page, or an older Windows.
            * **The Linux artifact has no window engine** — it serves the workstation and opens your browser. The native window works from a source install with PyGObject + WebKitGTK; bundling those into a frozen build is not done yet.
            * **No hardware has been validated.** Nothing here has been run against a real motorcycle. It starts in simulator mode and opens no serial port until you ask.

            Read `README.md` and `docs/DESKTOP.md` before connecting anything to a bike.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The installer is what a Windows user actually runs, and no human has
  # clicked through it yet. This job does the next best thing on a clean
  # runner: install it silently, launch the *installed* application's own
  # self-test, then uninstall it and check that the user's own files - session
  # logs, backups, base maps - were left where they were. The steps live in
  # packaging/installer/windows-install-check.ps1 so they can be read, and run,
  # without a workflow in the way.
  windows-install:
    name: Windows install and uninstall
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 25                  # a hung installer must not look busy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guzzionboard-windows-installer
          path: dist

      - name: Check the install check parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'packaging/installer/windows-install-check.ps1', [ref]$null, [ref]$errors)
          if ($errors.Count) {
            Write-Host "::error title=The install check has a syntax error::$($errors[0].Message)"
            exit 1
          }
          Write-Host 'the install check parses'

      - name: Install, launch, uninstall
        shell: pwsh
        run: pwsh -File packaging/installer/windows-install-check.ps1 -Dist dist

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-report
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/installed-selftest.log
          if-no-files-found: ignore

  desktop-ui:
    name: UI in the desktop shell (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -e .
      - run: npm ci
      - name: Run the workstation behind the desktop shell
        # The other browser gate runs the page on a static host (the demo
        # path). This one runs it behind `guzzionboard-desktop --no-window`:
        # real API, injected bridge, exports written to a real folder.
        run: npm run test:browser:desktop

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # publishes to the release; see the windows job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies and a webview engine
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgtk-3-0 libwebkit2gtk-4.1-0 \
                                  libgl1 libxkbcommon0 libegl1
          pip install pyinstaller
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Browser gate (the UI on a static host, as the demo serves it)
        run: |
          npm ci
          npx playwright test --config playwright.config.mjs
      - name: Build
        run: |
          set -o pipefail
          python packaging/build.py --portable-zip 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        run: |
          echo "::error title=Linux build failed::$(tail -c 1800 build.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"

      - name: Install it like a user would
        run: |
          set -o pipefail
          sh packaging/installer/linux-install-check.sh dist/GuzziOnBoard 2>&1 | tee install.log
      - name: Explain a failed install
        if: failure()
        run: |
          echo "::error title=Linux install failed::$(tail -c 1500 install.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"

      - uses: actions/upload-artifact@v4
        with:
          name: guzzionboard-linux
          path: |
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/linux-x64-selftest.log
            dist/linux-install-selftest.log
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        # No body here: the windows job owns the release notes, and an unset
        # body leaves them in place.
        with:
          files: |
            dist/*portable.zip
            dist/SHA256SUMS-*.txt
            dist/*selftest*.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS build
    runs-on: macos-latest
    permissions:
      contents: write          # publishes to the release; see the windows job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pyinstaller pywebview
      - name: Build the .app bundle and archive it
        run: |
          set -o pipefail
          python packaging/build.py --portable-zip 2>&1 | tee build.log
      - name: Explain a failed build
        if: failure()
        run: |
          echo "::error title=macOS build failed::$(tail -c 1800 build.log 2>/dev/null | tr '\n' '|' | tr -d '\r')"

      - uses: actions/upload-artifact@v4
        with:
          name: guzzionboard-macos
          path: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
            dist/macos-*-selftest.log
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        # No body here: the windows job owns the release notes, and an unset
        # body leaves them in place.
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS-*.txt
            dist/*selftest*.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
