[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guzzionboard"
version = "0.4.2"
description = "A multi-brand motorcycle diagnostics, calibration research, and workshop workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
# The desktop application's window. Everything else it needs is stdlib, and
# the app falls back to the system browser when this is absent (or when the
# platform's webview engine is missing), so it stays optional.
desktop = ["pywebview>=5.0"]
hardware = ["pyserial>=3.5", "python-can>=4.2"]
# Optional source-run Intrepid adapter; see docs/INTREPID_HARDWARE.md for
# platform libraries and libicsneo's Intrepid-only hardware license condition.
intrepid = ["python-can>=4.2", "python_ics>=1!26.3.17", "filelock>=3"]
dev = [
    "pytest>=7.4",
    # The suite takes about four minutes serially; the tests are independent
    # processes' worth of work, so run them in parallel.
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
# What packaging/build.py needs; pip install -e '.[desktop]' is the shortest
# route to running the workstation in a window from a checkout.
build = ["pyinstaller>=6.0"]

[project.scripts]
guzzionboard = "guzzionboard.__main__:main"
guzzionboard-desktop = "guzzionboard.desktop:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*"]
packages = ["guzzionboard", "guzzionboard.protocol", "guzzionboard.transports", "guzzionboard.catalog"]

[tool.setuptools.package-data]
"guzzionboard.catalog" = ["*.json", "ecus/*.json"]
"guzzionboard" = ["xdfs/*.json", "xdfs/*/*.xdf", "xdfs/*/*.XDF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is dominated by independent files (protocol, maps, server, desktop),
# so the default is a parallel run with file-level distribution. ``-p no:xdist``
# or running a single file still works serially.
addopts = ["-n", "auto", "--dist", "loadfile"]
# Broadcast/relay tests bind loopback sockets and compare wall-clock behaviour;
# grouping them keeps them on one worker.
markers = [
    "serial: must not run concurrently with itself (loopback servers, clocks)",
]

[tool.coverage.run]
source = ["guzzionboard"]
branch = true
omit = ["guzzionboard/key_worker.py", "guzzionboard/checksum_worker.py"]

[tool.coverage.report]
# Workers run in a fresh interpreter by design and are covered by their own
# behavioural tests; excluding them keeps the number honest rather than noisy.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
